<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指遣い一覧</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f9f9f9; }
        h1 { color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 0 auto 10px; }
        .card p { margin: 0; font-size: 14px; word-break: break-all; color: #555; }
    </style>
</head>
<body>

    <h1>リコーダー　指使い一覧</h1>
    
    <div class="grid">
        <!-- IMAGE_LIST_PLACEHOLDER -->
    </div>

    <script>
        // Actionsが作った画像リスト（images.json）を読み込んで全ロード
        fetch('images.json')
            .then(response => response.json())
            .then(pngFiles => {
                const grid = document.querySelector('.grid');
                pngFiles.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <a href="${file}" target="_blank">
                            <img src="${file}" alt="${file}">
                        </a>
                        <p>${file}</p>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => console.error('画像の読み込みに失敗しました:', err));
    </script>
    <!-- admax -->
<script src="https://adm.shinobi.jp/s/8d445be608c20da25393ba17bc0b7643"></script>
<!-- admax -->
</body>
</html>
